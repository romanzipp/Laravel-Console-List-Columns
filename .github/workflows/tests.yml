name: Tests

on: [ push, pull_request ]

jobs:
  test:
    name: "PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]
        laravel: [ "12", "13" ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --with="illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --no-scripts --no-progress --prefer-dist --prefer-stable

      - name: Execute tests
        run: vendor/bin/phpunit
